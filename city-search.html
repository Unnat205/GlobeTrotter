<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotter — Explore Cities</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--font-sans)', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: 'var(--color-primary-50)',
              100: 'var(--color-primary-100)',
              200: 'var(--color-primary-200)',
              300: 'var(--color-primary-300)',
              400: 'var(--color-primary-400)',
              450: 'var(--color-primary-450)',
              500: 'var(--color-primary-500)',
              600: 'var(--color-primary-600)',
              700: 'var(--color-primary-700)',
              800: 'var(--color-primary-800)',
              850: 'var(--color-neutral-850)',
              900: 'var(--color-neutral-900)',
            },
            neutral: {
              950: 'var(--color-neutral-950)',
              900: 'var(--color-neutral-900)',
              850: 'var(--color-neutral-850)',
              800: 'var(--color-neutral-800)',
              750: 'var(--color-neutral-750)',
              700: 'var(--color-neutral-700)',
              650: 'var(--color-neutral-650)',
              600: 'var(--color-neutral-600)',
              450: 'var(--color-neutral-450)',
              400: 'var(--color-neutral-400)',
              350: 'var(--color-neutral-350)',
              300: 'var(--color-neutral-300)',
              200: 'var(--color-neutral-200)',
              100: 'var(--color-neutral-100)',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/custom.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col page-fade-in" x-data="citySearchPage" x-init="initCityPage()">

  <!-- Toast Container and Navbar will be injected automatically -->

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8" x-cloak x-show="authorized">
    
    <!-- Page Title -->
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-white">Explore Destinations</h1>
      <p class="text-neutral-400 text-sm mt-1">Browse our seed database of cities to kickstart your travel itineraries.</p>
    </div>

    <!-- Filters Bar -->
    <div class="glass-card rounded-2xl border border-neutral-800/40 p-5 mb-8 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        
        <!-- Search input -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-450 mb-1.5">Search City or Country</label>
          <div class="relative">
            <input type="text" x-model="searchQuery" placeholder="e.g. Kyoto..."
              class="w-full bg-neutral-900 border border-neutral-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500/50">
            <i data-lucide="search" class="w-4 h-4 text-neutral-500 absolute left-3 top-3"></i>
          </div>
        </div>

        <!-- Region selector -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-450 mb-1.5">Region</label>
          <select x-model="selectedRegion" 
            class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500/50">
            <option value="">All Regions</option>
            <option value="Europe">Europe</option>
            <option value="Asia">Asia</option>
            <option value="North America">North America</option>
            <option value="South America">South America</option>
            <option value="Africa">Africa</option>
            <option value="Oceania">Oceania</option>
            <option value="Middle East">Middle East</option>
          </select>
        </div>

        <!-- Cost index filter -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-450 mb-1.5">Average Cost Index</label>
          <select x-model="selectedCost" 
            class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500/50">
            <option value="">Any Cost</option>
            <option value="1">Budget Friendly ($)</option>
            <option value="2">Moderate ($$)</option>
            <option value="3">Average ($$$)</option>
            <option value="4">Premium ($$$$)</option>
            <option value="5">Luxury ($$$$$)</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Cities Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <template x-for="city in filteredCities" :key="city.name">
        <div class="glass-card rounded-2xl overflow-hidden border border-neutral-800/40 flex flex-col group hover:scale-[1.01] transition-transform duration-200">
          
          <!-- Photo -->
          <div class="h-44 relative overflow-hidden bg-neutral-900">
            <img :src="city.image_url" :alt="city.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            
            <!-- Region Badge -->
            <span class="absolute top-4 left-4 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 bg-black/60 backdrop-blur-md rounded border border-white/10 text-white" x-text="city.region"></span>
            
            <!-- Cost indicator -->
            <div class="absolute bottom-4 left-4 px-2 py-0.5 bg-neutral-950/80 backdrop-blur-sm rounded border border-neutral-800 flex gap-0.5 text-emerald-450 items-center">
              <span class="text-[10px] font-semibold tracking-wider text-emerald-400" x-text="'$'.repeat(city.avg_cost_index)"></span>
            </div>
          </div>

          <!-- Description / Add -->
          <div class="p-4 flex-grow flex flex-col justify-between">
            <div class="mb-4">
              <h3 class="text-base font-bold text-white group-hover:text-emerald-400 transition-colors" x-text="city.name"></h3>
              <p class="text-xs text-neutral-450 mt-0.5 flex items-center gap-1">
                <i data-lucide="map" class="w-3 h-3"></i>
                <span x-text="city.country"></span>
              </p>
            </div>
            
            <button @click="openAddStopModal(city)" 
              class="w-full py-2 bg-neutral-900 hover:bg-emerald-500 border border-neutral-800 hover:border-emerald-500 hover:text-black text-xs font-semibold text-neutral-300 rounded-xl transition-all flex items-center justify-center gap-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span>Add to Active Trip</span>
            </button>
          </div>

        </div>
      </template>
    </div>

    <!-- Empty state -->
    <div x-show="filteredCities.length === 0" class="text-center py-12">
      <p class="text-neutral-400 text-sm">No cities found matching your filter options.</p>
    </div>

    <!-- Add City to Trip Overlay Modal -->
    <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md px-4" x-transition>
      <div class="glass-panel w-full max-w-md rounded-2xl p-6 border border-neutral-800 shadow-2xl relative" @click.away="showModal = false">
        
        <button @click="showModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <div class="flex items-center gap-3 mb-6">
          <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl">
            <i data-lucide="plane-takeoff" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="text-lg font-bold text-white">Add Stop to Trip</h3>
            <p class="text-xs text-neutral-400" x-text="'Select trip for ' + targetCity?.name"></p>
          </div>
        </div>

        <!-- Add Stop form -->
        <form @submit.prevent="submitQuickStop" class="space-y-4">
          
          <!-- Select active trip -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Select Trip</label>
            <select x-model="selectedTripId" required @change="onTripSelected()"
              class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none">
              <option value="">-- Choose active trip --</option>
              <template x-for="trip in userTrips" :key="trip.id">
                <option :value="trip.id" x-text="trip.name"></option>
              </template>
            </select>
          </div>

          <!-- Date Boundaries helper -->
          <div x-show="selectedTrip" class="p-3 bg-neutral-900 border border-neutral-850 rounded-lg text-[10px] text-neutral-450 leading-relaxed">
            Trip dates: <span class="text-neutral-350" x-text="formatDateRange(selectedTrip.start_date, selectedTrip.end_date)"></span>
          </div>

          <!-- Dates -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Arrival</label>
              <input type="date" x-model="quickArrival" required @change="validateStopDates()"
                class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Departure</label>
              <input type="date" x-model="quickDeparture" required @change="validateStopDates()"
                class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white">
            </div>
          </div>

          <!-- Budget -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Stop Budget ($)</label>
            <input type="number" step="0.01" min="0" x-model="quickBudget" required placeholder="0.00" 
              class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5 text-xs text-white">
          </div>

          <div class="pt-2">
            <button type="submit" :disabled="submittingStop || stopDateError || !selectedTripId"
              class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 disabled:bg-neutral-800 disabled:text-neutral-500 text-black font-semibold text-xs rounded-xl transition-all flex items-center justify-center gap-1">
              <span x-show="submittingStop" class="w-3.5 h-3.5 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
              <i x-show="!submittingStop" data-lucide="check" class="w-3.5 h-3.5"></i>
              <span>Add Stop to Trip</span>
            </button>
          </div>
        </form>

      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script type="module">
    import { getSession } from './js/auth.js';
    import { loadNavbar, showToast, refreshIcons } from './js/ui-helpers.js';
    import { getTrips } from './js/trips.js';
    import { createStop } from './js/stops.js';

    const initCitySearchPage = () => {
      Alpine.data('citySearchPage', () => ({
        authorized: false,
        cities: [],
        userTrips: [],
        
        // Search filter variables
        searchQuery: '',
        selectedRegion: '',
        selectedCost: '',

        // Modal triggers
        showModal: false,
        targetCity: null,
        selectedTripId: '',
        selectedTrip: null,
        quickArrival: '',
        quickDeparture: '',
        quickBudget: '',
        submittingStop: false,
        stopDateError: false,

        async initCityPage() {
          const session = await getSession();
          if (!session) {
            window.location.href = 'index.html';
            return;
          }
          this.authorized = true;
          await loadNavbar();
          await this.loadCities();
          await this.loadUserTrips();
        },

        async loadCities() {
          try {
            const res = await fetch('./data/cities-seed.json');
            this.cities = await res.json();
            refreshIcons();
          } catch (e) {
            showToast("Failed to fetch seeded city list", "error");
          }
        },

        async loadUserTrips() {
          try {
            this.userTrips = await getTrips();
          } catch (e) {
            console.error("Could not fetch trips", e);
          }
        },

        get filteredCities() {
          return this.cities.filter(c => {
            const matchesQuery = !this.searchQuery || 
              c.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
              c.country.toLowerCase().includes(this.searchQuery.toLowerCase());
            
            const matchesRegion = !this.selectedRegion || c.region === this.selectedRegion;
            const matchesCost = !this.selectedCost || c.avg_cost_index === parseInt(this.selectedCost);
            
            return matchesQuery && matchesRegion && matchesCost;
          });
        },

        openAddStopModal(city) {
          if (this.userTrips.length === 0) {
            showToast("Please create a trip itinerary first!", "info");
            return;
          }
          this.targetCity = city;
          this.showModal = true;
          this.selectedTripId = '';
          this.selectedTrip = null;
          this.quickArrival = '';
          this.quickDeparture = '';
          this.quickBudget = city.avg_cost_index * 150; // suggest default budget
          refreshIcons();
        },

        onTripSelected() {
          this.selectedTrip = this.userTrips.find(t => t.id === this.selectedTripId);
          if (this.selectedTrip) {
            this.quickArrival = this.selectedTrip.start_date;
            this.quickDeparture = this.selectedTrip.start_date;
          }
        },

        validateStopDates() {
          if (!this.selectedTrip) return;
          this.stopDateError = false;
          
          const tripStart = new Date(this.selectedTrip.start_date);
          const tripEnd = new Date(this.selectedTrip.end_date);
          const arrival = new Date(this.quickArrival);
          const departure = new Date(this.quickDeparture);

          if (arrival < tripStart || arrival > tripEnd) {
            showToast("Arrival date must fall inside trip date limits.", "error");
            this.stopDateError = true;
            return;
          }

          if (departure < tripStart || departure > tripEnd) {
            showToast("Departure date must fall inside trip date limits.", "error");
            this.stopDateError = true;
            return;
          }

          if (departure < arrival) {
            showToast("Departure date is prior to Arrival date.", "error");
            this.stopDateError = true;
          }
        },

        async submitQuickStop() {
          if (this.stopDateError || !this.selectedTripId) return;
          this.submittingStop = true;
          try {
            await createStop({
              trip_id: this.selectedTripId,
              city_name: this.targetCity.name,
              country: this.targetCity.country,
              start_date: this.quickArrival,
              end_date: this.quickDeparture,
              budget: parseFloat(this.quickBudget) || 0
            });
            showToast(`Added ${this.targetCity.name} to ${this.selectedTrip.name}!`, "success");
            this.showModal = false;
          } catch (e) {
            showToast("Failed to link stop: " + e.message, "error");
          } finally {
            this.submittingStop = false;
          }
        },

        formatDateRange(start, end) {
          const opt = { month: 'short', day: 'numeric', year: 'numeric' };
          const s = new Date(start).toLocaleDateString(undefined, opt);
          const e = new Date(end).toLocaleDateString(undefined, opt);
          return `${s} — ${e}`;
        }
      }));
    };

    if (window.Alpine) {
      initCitySearchPage();
    } else {
      document.addEventListener('alpine:init', initCitySearchPage);
    }
  </script>
  <!-- Alpine.js (Must load AFTER module scripts register components) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>

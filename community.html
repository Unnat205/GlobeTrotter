<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotter — Community Shared Adventures</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--font-sans)', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: 'var(--color-primary-50)',
              100: 'var(--color-primary-100)',
              200: 'var(--color-primary-200)',
              300: 'var(--color-primary-300)',
              400: 'var(--color-primary-400)',
              450: 'var(--color-primary-450)',
              500: 'var(--color-primary-500)',
              600: 'var(--color-primary-600)',
              700: 'var(--color-primary-700)',
              800: 'var(--color-primary-800)',
              850: 'var(--color-neutral-850)',
              900: 'var(--color-neutral-900)',
            },
            neutral: {
              950: 'var(--color-neutral-950)',
              900: 'var(--color-neutral-900)',
              850: 'var(--color-neutral-850)',
              800: 'var(--color-neutral-800)',
              750: 'var(--color-neutral-750)',
              700: 'var(--color-neutral-700)',
              650: 'var(--color-neutral-650)',
              600: 'var(--color-neutral-600)',
              450: 'var(--color-neutral-450)',
              400: 'var(--color-neutral-400)',
              350: 'var(--color-neutral-350)',
              300: 'var(--color-neutral-300)',
              200: 'var(--color-neutral-200)',
              100: 'var(--color-neutral-100)',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/custom.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex flex-col page-fade-in" x-data="communityPage" x-init="initCommunity()">

  <!-- Toast Container and Navbar will be injected automatically -->

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8" x-cloak x-show="authorized">
    
    <!-- Hero Banner Card (Screen 3 & 10 styled banner) -->
    <div class="relative rounded-3xl overflow-hidden mb-8 border border-neutral-800/50 shadow-2xl h-48 sm:h-56">
      <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1200&q=80" alt="Adventure Banner" class="w-full h-full object-cover brightness-[0.45]">
      <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/20 to-transparent"></div>
      <div class="absolute inset-0 flex flex-col justify-end p-6 sm:p-8">
        <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-white">Community Explorations</h1>
        <p class="text-xs sm:text-sm text-neutral-350 max-w-lg mt-1.5 leading-relaxed">
          Discover hand-crafted multi-city road trips, transit schedules, and sight-seeing itineraries shared by explorers around the globe.
        </p>
      </div>
    </div>

    <!-- Search, Filter, Group, Sort Toolbar (Screen 10 Controls) -->
    <div class="glass-card rounded-2xl border border-neutral-800/40 p-5 mb-8 flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
      
      <!-- Search Input -->
      <div class="relative flex-grow max-w-md">
        <input type="text" x-model="searchQuery" placeholder="Search adventure names or locations..."
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-emerald-500/50">
        <i data-lucide="search" class="w-4 h-4 text-neutral-500 absolute left-3.5 top-3"></i>
      </div>

      <!-- Filters & Sorting buttons -->
      <div class="flex items-center gap-3 flex-wrap">
        
        <!-- Group by -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" 
            :class="groupBy !== 'none' ? 'border-emerald-500/40 text-emerald-400 bg-emerald-500/5' : 'border-neutral-800 text-neutral-400 hover:text-white'"
            class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-neutral-900 border transition-all flex items-center gap-1.5">
            <i data-lucide="folder-tree" class="w-3.5 h-3.5"></i>
            <span x-text="groupBy === 'none' ? 'Group by' : 'Grouped'"></span>
          </button>
          <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 mt-2 w-40 rounded-xl border border-neutral-800 bg-neutral-950/95 shadow-2xl p-1 z-35">
            <button @click="groupBy = 'none'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">No Grouping</button>
            <button @click="groupBy = 'month'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">By Month</button>
            <button @click="groupBy = 'stops'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">By Stops Count</button>
          </div>
        </div>

        <!-- Filter -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" 
            :class="filterRegion !== 'all' ? 'border-emerald-500/40 text-emerald-400 bg-emerald-500/5' : 'border-neutral-800 text-neutral-400 hover:text-white'"
            class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-neutral-900 border transition-all flex items-center gap-1.5">
            <i data-lucide="filter" class="w-3.5 h-3.5"></i>
            <span x-text="filterRegion === 'all' ? 'All Themes' : (filterRegion === 'family' ? 'Family Getaways' : (filterRegion === 'date' ? 'Romantic Date' : 'Spiritual & Nature'))"></span>
          </button>
          <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 mt-2 w-44 rounded-xl border border-neutral-800 bg-neutral-950/95 shadow-2xl p-1 z-35">
            <button @click="filterRegion = 'all'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">All Themes</button>
            <button @click="filterRegion = 'family'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">Family Getaways</button>
            <button @click="filterRegion = 'date'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">Romantic Date</button>
            <button @click="filterRegion = 'spiritual'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">Spiritual & Nature</button>
          </div>
        </div>

        <!-- Sort by -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" 
            class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition-all flex items-center gap-1.5">
            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-neutral-400"></i>
            <span x-text="'Sort: ' + sortByLabel"></span>
          </button>
          <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 mt-2 w-40 rounded-xl border border-neutral-800 bg-neutral-950/95 shadow-2xl p-1 z-35">
            <button @click="sortBy = 'newest'; sortByLabel = 'Newest'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">Newest</button>
            <button @click="sortBy = 'stops'; sortByLabel = 'Stops'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">Stops Count</button>
            <button @click="sortBy = 'name'; sortByLabel = 'Trip Name'; open = false" class="w-full text-left px-3 py-2 text-xs hover:bg-neutral-900 rounded-lg text-neutral-300">Trip Name</button>
          </div>
        </div>

      </div>
    </div>

    <!-- Grouped Trips Display -->
    <div x-show="groupBy !== 'none' && !loading" class="space-y-8">
      <template x-for="group in groupedTrips" :key="group.title">
        <div class="space-y-4">
          <h2 class="text-sm font-extrabold text-emerald-450 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="folder" class="w-4 h-4 text-emerald-450"></i>
            <span x-text="group.title"></span>
            <span class="text-xs text-neutral-600 font-semibold" x-text="'(' + group.items.length + ')'"></span>
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="trip in group.items" :key="trip.id">
              <div class="glass-card rounded-2xl overflow-hidden border border-neutral-800/40 hover:border-neutral-700/60 flex flex-col relative group transition-colors">
                <div class="h-44 overflow-hidden relative bg-neutral-900 border-b border-neutral-850">
                  <img :src="trip.cover_photo_url" :alt="trip.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                  <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center">
                    <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 bg-emerald-500/25 text-emerald-400 rounded-full border border-emerald-500/20 backdrop-blur-md">Shared Plan</span>
                  </div>
                </div>
                <div class="p-5 flex-grow flex flex-col justify-between">
                  <div>
                    <h3 class="text-base font-bold text-white line-clamp-1" x-text="trip.name"></h3>
                    <p class="text-[10px] text-neutral-450 mt-1 flex items-center gap-1.5">
                      <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                      <span x-text="formatDateRange(trip.start_date, trip.end_date)"></span>
                    </p>
                    <p class="text-xs text-neutral-300 mt-3 line-clamp-2" x-text="trip.description || 'Custom curated road trip itinerary.'"></p>
                  </div>
                  <div class="mt-4 pt-4 border-t border-neutral-850/80 flex items-center justify-between">
                    <div class="flex items-center gap-1 text-[10px] text-neutral-450">
                      <i data-lucide="map-pin" class="w-3.5 h-3.5 text-neutral-500"></i>
                      <span x-text="trip.stopsCount + ' stops'"></span>
                    </div>
                    <a :href="'shared-trip.html?slug=' + trip.share_slug" class="px-3.5 py-1.5 bg-neutral-900 hover:bg-neutral-850 text-[10px] font-bold rounded-lg border border-neutral-800 text-white transition-colors flex items-center gap-1">
                      <span>View Route</span>
                      <i data-lucide="chevron-right" class="w-3 h-3"></i>
                    </a>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Ungrouped Trips Grid -->
    <div x-show="groupBy === 'none' && !loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="trip in sortedAndFilteredTrips" :key="trip.id">
        <div class="glass-card rounded-2xl overflow-hidden border border-neutral-800/40 hover:border-neutral-700/60 flex flex-col relative group transition-colors">
          <div class="h-44 overflow-hidden relative bg-neutral-900 border-b border-neutral-850">
            <img :src="trip.cover_photo_url" :alt="trip.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center">
              <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 bg-emerald-500/25 text-emerald-400 rounded-full border border-emerald-500/20 backdrop-blur-md">Shared Plan</span>
            </div>
          </div>
          <div class="p-5 flex-grow flex flex-col justify-between">
            <div>
              <h3 class="text-base font-bold text-white line-clamp-1" x-text="trip.name"></h3>
              <p class="text-[10px] text-neutral-450 mt-1 flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span x-text="formatDateRange(trip.start_date, trip.end_date)"></span>
              </p>
              <p class="text-xs text-neutral-300 mt-3 line-clamp-2" x-text="trip.description || 'Custom curated road trip itinerary.'"></p>
            </div>
            <div class="mt-4 pt-4 border-t border-neutral-850/80 flex items-center justify-between">
              <div class="flex items-center gap-1 text-[10px] text-neutral-450">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-neutral-500"></i>
                <span x-text="trip.stopsCount + ' stops'"></span>
              </div>
              <a :href="'shared-trip.html?slug=' + trip.share_slug" class="px-3.5 py-1.5 bg-neutral-900 hover:bg-neutral-850 text-[10px] font-bold rounded-lg border border-neutral-800 text-white transition-colors flex items-center gap-1">
                <span>View Route</span>
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </a>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty State -->
    <div x-show="!loading && sortedAndFilteredTrips.length === 0" class="glass-card rounded-2xl border border-neutral-800/60 p-12 text-center flex flex-col items-center justify-center max-w-xl mx-auto my-8">
      <div class="w-16 h-16 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center text-neutral-400 mb-4">
        <i data-lucide="globe-2" class="w-8 h-8"></i>
      </div>
      <h3 class="text-xl font-bold text-white mb-2">No public plans found</h3>
      <p class="text-xs text-neutral-450 mb-6 max-w-sm">
        Change your filters or search keywords. Be the first to publish a public itinerary!
      </p>
    </div>

  </main>

  <!-- Scripts -->
  <script type="module">
    import { getSession } from './js/auth.js';
    import { loadNavbar, showToast, refreshIcons } from './js/ui-helpers.js';
    import { getSupabase } from './js/supabase-client.js';

    const initCommunityPage = () => {
      Alpine.data('communityPage', () => ({
        authorized: false,
        loading: true,
        trips: [],
        searchQuery: '',
        groupBy: 'none', // none, month, stops
        filterRegion: 'all', // all, europe, asia, americas
        sortBy: 'newest', // newest, stops, name
        sortByLabel: 'Newest',

        async initCommunity() {
          const session = await getSession();
          if (!session) {
            window.location.href = 'index.html';
            return;
          }
          this.authorized = true;
          await loadNavbar();
          await this.loadPublicTrips();
        },

        async loadPublicTrips() {
          this.loading = true;
          try {
            const supabase = getSupabase();
            let enriched = [];
            if (supabase) {
              // Get trips where is_public is true
              const { data: publicTrips, error } = await supabase
                .from('trips')
                .select('*')
                .eq('is_public', true)
                .order('created_at', { ascending: false });

              if (error) throw error;

              // Enrich with stops count
              for (let t of (publicTrips || [])) {
                const { count, error: stopError } = await supabase
                  .from('stops')
                  .select('*', { count: 'exact', head: true })
                  .eq('trip_id', t.id);

                enriched.push({
                  ...t,
                  stopsCount: count || 0
                });
              }
            }

            // Always prepend our highly curated Gujarat itineraries to the community feed
            const curated = [
              {
                id: "curated_jamnagar",
                name: "Jamnagar Royal Heritage & Birding (Family Getaway)",
                description: "Curated weekend visit to Lakhota Lake & Palace, Khijadiya Bird Sanctuary, and ancient heritage markets. Thoughtfully paced for family travel.",
                start_date: "2026-10-12",
                end_date: "2026-10-15",
                cover_photo_url: "https://images.unsplash.com/photo-1596422846543-75c6fc18a523?auto=format&fit=crop&w=800&q=80",
                share_slug: "jamnagar-family-heritage",
                stopsCount: 1,
                theme: "family",
                created_at: new Date().toISOString()
              },
              {
                id: "curated_ahmedabad",
                name: "Ahmedabad Heritage & Sabarmati Cafe Date (Romantic / Culture)",
                description: "Explore the stunning Adalaj Stepwell, Sabarmati Ashram, Sabarmati Riverfront Walk, and a heritage candle-lit dinner at Agashiye.",
                start_date: "2026-11-20",
                end_date: "2026-11-22",
                cover_photo_url: "https://images.unsplash.com/photo-1605649487212-47bdab064df7?auto=format&fit=crop&w=800&q=80",
                share_slug: "ahmedabad-romantic-culture",
                stopsCount: 1,
                theme: "date",
                created_at: new Date(Date.now() - 1000 * 60).toISOString()
              },
              {
                id: "curated_gandhinagar",
                name: "Gandhinagar Green Belt & Akshardham Retreat (Nature & Spiritual)",
                description: "Spiritual weekend itinerary featuring the Akshardham Temple complex, Indroda Dinosaur & Fossil Park, and Sarita Udyan.",
                start_date: "2026-12-05",
                end_date: "2026-12-07",
                cover_photo_url: "https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=800&q=80",
                share_slug: "gandhinagar-spiritual-nature",
                stopsCount: 1,
                theme: "spiritual",
                created_at: new Date(Date.now() - 2000 * 60).toISOString()
              }
            ];

            this.trips = [...curated, ...enriched];

            refreshIcons();
          } catch (e) {
            showToast("Failed to retrieve public plans", "error");
          } finally {
            this.loading = false;
          }
        },

        get sortedAndFilteredTrips() {
          let list = [...this.trips];

          // Search
          if (this.searchQuery) {
            const q = this.searchQuery.toLowerCase();
            list = list.filter(t => 
              t.name.toLowerCase().includes(q) || 
              (t.description && t.description.toLowerCase().includes(q))
            );
          }

          // Filter by Theme
          if (this.filterRegion !== 'all') {
            list = list.filter(t => {
              // Exact theme property matching
              if (t.theme === this.filterRegion) return true;
              
              // Fallback substring matching on description/name for user created trips
              const text = `${t.name} ${t.description || ''}`.toLowerCase();
              if (this.filterRegion === 'family') {
                return text.includes('family') || text.includes('kid') || text.includes('parent') || text.includes('children') || text.includes('jamnagar');
              } else if (this.filterRegion === 'date') {
                return text.includes('romantic') || text.includes('date') || text.includes('couple') || text.includes('ahmedabad') || text.includes('ahemdabad');
              } else if (this.filterRegion === 'spiritual') {
                return text.includes('spiritual') || text.includes('nature') || text.includes('temple') || text.includes('retreat') || text.includes('gandhinagar');
              }
              return false;
            });
          }

          // Sort
          if (this.sortBy === 'name') {
            list.sort((a, b) => a.name.localeCompare(b.name));
          } else if (this.sortBy === 'stops') {
            list.sort((a, b) => b.stopsCount - a.stopsCount);
          } else {
            // Newest
            list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          }

          return list;
        },

        get groupedTrips() {
          const list = this.sortedAndFilteredTrips;
          const groups = {};

          if (this.groupBy === 'month') {
            list.forEach(t => {
              const date = new Date(t.start_date);
              const monthLabel = date.toLocaleString(undefined, { month: 'long', year: 'numeric' });
              if (!groups[monthLabel]) groups[monthLabel] = [];
              groups[monthLabel].push(t);
            });
          } else if (this.groupBy === 'stops') {
            list.forEach(t => {
              const stopLabel = `${t.stopsCount} stops planned`;
              if (!groups[stopLabel]) groups[stopLabel] = [];
              groups[stopLabel].push(t);
            });
          }

          return Object.keys(groups).map(key => ({
            title: key,
            items: groups[key]
          }));
        },

        formatDateRange(start, end) {
          const opt = { month: 'short', day: 'numeric' };
          const s = new Date(start).toLocaleDateString(undefined, opt);
          const e = new Date(end).toLocaleDateString(undefined, { ...opt, year: 'numeric' });
          return `${s} — ${e}`;
        }
      }));
    };

    if (window.Alpine) {
      initCommunityPage();
    } else {
      document.addEventListener('alpine:init', initCommunityPage);
    }
  </script>
  <!-- AlpineJS -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
